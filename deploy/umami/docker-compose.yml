# Umami 自建访问统计（免费、开源、无 Cookie）
# 用法见 README.md
# 线上入口：https://ys.tongzhoukuajing.com/umami/ （主站路径反代，不是独立子域）
services:
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: yuanshan-umami
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      # 公网挂在 /umami。官方镜像的页面资源仍在容器根路径 /_next，
      # Nginx 用 proxy_pass 去掉前缀；见 README。
      BASE_PATH: /umami
      APP_SECRET: ${APP_SECRET}
      DISABLE_TELEMETRY: "1"
    depends_on:
      umami-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  umami-db:
    image: postgres:16-alpine
    container_name: yuanshan-umami-db
    restart: unless-stopped
    # 这台 VPS 上不加这两项，initdb 会 Operation not permitted，库起不来。
    privileged: true
    security_opt:
      - "seccomp:unconfined"
    volumes:
      - umami-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  umami-postgres-data:
