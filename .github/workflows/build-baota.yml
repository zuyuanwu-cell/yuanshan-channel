name: Build for Baota

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baota-deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate content
        run: npm run validate:content

      - name: Build for Baota
        run: npm run build:baota
        env:
          # Optional: set repo Secrets to inject Umami. Empty = no tracking script.
          PUBLIC_UMAMI_URL: ${{ secrets.PUBLIC_UMAMI_URL }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.PUBLIC_UMAMI_WEBSITE_ID }}

      - name: Publish dist to deploy branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORK=$(mktemp -d)
          cp -a dist/. "$WORK/"
          cd "$WORK"
          git init
          git checkout -b deploy
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "deploy: ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
